[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!jm-website/images/inbox' ':!jm-website/images/inbox/**'"

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[redirects]]
  from = "/images/mark-jm.png"
  to = "/jm-website/images/signature.png"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/jm-website/:splat"
  status = 200
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://moriphoto.github.io"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
