<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection — John Mackenzie Ceramics</title>
  <style>
    :root { --rust:#8a4a22; --copper:#6e3214; --umber:#4a2814; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #f3f3f3;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .stage { height: 100%; position: relative; background: #000; }
    img { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    button.arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 64px; height: 96px; color: #fff; background: none; border: 0; cursor: pointer; opacity: .8;
    }
    button.arrow.prev { left: 8px; }
    button.arrow.next { right: 8px; }
    button.arrow svg { width: 48px; height: 48px; }
    .caption {
      position: absolute; left: 28px; bottom: 24px; z-index: 2;
      max-width: min(440px, 78vw);
      padding: 16px 18px 14px;
      background: rgba(255,255,255,.78);
      border-left: 3px solid var(--rust);
    }
    .kicker {
      font-size: 10px; font-weight: 700; letter-spacing: .22em;
      text-transform: uppercase; color: var(--rust); margin-bottom: 8px;
    }
    h1 { font-size: clamp(22px, 3vw, 34px); font-weight: 700; letter-spacing: -.02em; color: var(--copper); }
    .count { position: absolute; right: 28px; bottom: 32px; color: var(--rust); font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    .miss { position: absolute; inset: 0; display: grid; place-items: center; color: #bbb; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div class="stage">
    <img id="pic" alt="">
    <button class="arrow prev" id="prev" aria-label="Previous"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M30 8 L14 24 L30 40"/></svg></button>
    <button class="arrow next" id="next" aria-label="Next"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8 L34 24 L18 40"/></svg></button>
    <div class="caption">
      <div class="kicker">Wood-fired · Cornwall</div>
      <h1 id="title">Selection</h1>
    </div>
    <div class="count" id="count"></div>
    <div class="miss" id="miss" hidden>This link is not ready yet. Wait a minute and refresh.</div>
  </div>
  <script>
    var set = new URLSearchParams(location.search).get("set") || "";
    var pieces = [];
    var i = 0;
    var pic = document.getElementById("pic");
    var title = document.getElementById("title");
    var count = document.getElementById("count");
    function show() {
      if (!pieces.length) return;
      var p = pieces[i];
      pic.src = p.src;
      title.textContent = p.title || "Selection";
      count.textContent = pieces.length > 1 ? (i + 1) + " / " + pieces.length : "";
      document.getElementById("prev").style.visibility = pieces.length > 1 ? "visible" : "hidden";
      document.getElementById("next").style.visibility = pieces.length > 1 ? "visible" : "hidden";
    }
    function step(n) {
      if (!pieces.length) return;
      i = (i + n + pieces.length) % pieces.length;
      show();
    }
    document.getElementById("prev").onclick = function () { step(-1); };
    document.getElementById("next").onclick = function () { step(1); };
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });
    if (!set) {
      document.getElementById("miss").hidden = false;
    } else {
      fetch("images/share/" + encodeURIComponent(set) + "/manifest.json?t=" + Date.now())
        .then(function (r) { if (!r.ok) throw new Error("missing"); return r.json(); })
        .then(function (data) {
          pieces = (data.pieces || []).map(function (p) {
            return { src: "images/share/" + set + "/" + p.file, title: p.title };
          });
          if (!pieces.length) throw new Error("empty");
          show();
        })
        .catch(function () { document.getElementById("miss").hidden = false; });
    }
  </script>
</body>
</html>
