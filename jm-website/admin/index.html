<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit — John Mackenzie Ceramics</title>
  <style>
    #cms-brand {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: none;
      align-items: center;
      gap: 16px;
      pointer-events: none;
      white-space: nowrap;
    }
    #cms-brand .nm,
    #cms-brand .cv {
      font: 700 10px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    #cms-brand .nm { color: #f3f3f3; }
    #cms-brand .cv { color: #8a4a22; }
    #cms-app-btn {
      pointer-events: auto;
      color: #c4a35a;
      border: 1px solid #c4a35a;
      background: #0a0a0a;
      text-decoration: none;
      font: 700 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 9px 16px;
    }
    #cms-app-btn:hover { color: #fff; border-color: #fff; }
    @media (max-width: 820px) {
      #cms-brand .nm, #cms-brand .cv { display: none; }
    }
    img:not(#cms-brand img) {
      max-height: 360px !important;
      max-width: 100% !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      background: #111;
    }
    .cms-open-piece {
      outline: 1px solid #c4a35a !important;
      background: rgba(196,163,90,.12) !important;
    }
  </style>
</head>
<body>
  <div id="cms-brand">
    <span class="nm">John Mackenzie Ceramics</span>
    <a id="cms-app-btn" href="../studio/">App</a>
    <span class="cv">Cove</span>
  </div>
  <script>
    localStorage.setItem("netlifySiteURL", "https://jmceramics.netlify.app");
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" data-netlify-identity="https://jmceramics.netlify.app/.netlify/identity"></script>
  <script>
    (function () {
      var API = "https://jmceramics.netlify.app/.netlify/identity";
      if (!window.netlifyIdentity) return;
      var raw = netlifyIdentity.init.bind(netlifyIdentity);
      netlifyIdentity.init = function (opts) {
        opts = opts || {};
        opts.APIUrl = API;
        return raw(opts);
      };
      netlifyIdentity.init({ APIUrl: API });
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="preview-works.js"></script>
  <script>
    (function () {
      var onPages = location.hostname.indexOf("github.io") !== -1;
      var publicFolder = onPages ? "/jm-website/images" : "/images";
      var siteUrl = onPages ? (location.origin + "/jm-website") : "https://jmceramics.netlify.app";
      CMS.init({
        config: {
          load_config_file: true,
          public_folder: publicFolder,
          site_url: siteUrl,
          display_url: siteUrl
        }
      });

      var brand = document.getElementById("cms-brand");
      function show() { if (brand) brand.style.display = "flex"; }
      function hide() { if (brand) brand.style.display = "none"; }
      hide();
      if (window.netlifyIdentity) {
        netlifyIdentity.on("init", function (user) { if (user) show(); else hide(); });
        netlifyIdentity.on("login", show);
        netlifyIdentity.on("logout", hide);
      }
      setInterval(function () {
        if (document.querySelector("[class*='AppHeader'], header, [class*='Navbar']")) show();
      }, 1500);

      var ROOT = "https://moriphoto.github.io/jm-website/";
      function fixImg(img) {
        if (!img || img.closest("#cms-brand")) return;
        var s = img.getAttribute("src") || img.currentSrc || "";
        if (!s || s.indexOf("blob:") === 0) return;
        var i = s.indexOf("images/");
        var next = "";
        if (i !== -1) next = ROOT + s.slice(i);
        else if (s.indexOf("studio/") !== -1) next = ROOT + "images/" + s.slice(s.indexOf("studio/"));
        if (next && img.getAttribute("src") !== next) img.setAttribute("src", next);
      }
      function fixAll() {
        document.querySelectorAll("img").forEach(fixImg);
      }
      new MutationObserver(fixAll).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["src"] });
      setInterval(fixAll, 800);

      function pingPreview(id, title) {
        try { localStorage.setItem("cmsFocusId", id || ""); } catch (err) {}
        document.querySelectorAll("iframe").forEach(function (f) {
          try {
            f.contentWindow.postMessage({ type: "cms-open-piece", id: id, title: title }, "*");
          } catch (err) {}
        });
      }
      document.addEventListener("click", function (e) {
        var n = e.target;
        for (var k = 0; n && k < 6; n = n.parentElement, k++) {
          var s = (n.textContent || "").replace(/\s+/g, " ").trim();
          var m = s.match(/^(\d{1,3})\s{1,3}(.{2,40})$/);
          if (!m) continue;
          if (m[0].length > 60) continue;
          pingPreview(m[1], m[2]);
          var row = n.closest("[class*='NestedObject']") || n.closest("[class*='ListControl']") || n.closest("li") || n;
          document.querySelectorAll(".cms-open-piece").forEach(function (x) { x.classList.remove("cms-open-piece"); });
          row.classList.add("cms-open-piece");
          return;
        }
      }, true);

      function openPiece(id, title) {
        pingPreview(id, title);
        document.querySelectorAll(".cms-open-piece").forEach(function (n) { n.classList.remove("cms-open-piece"); });
        var nodes = document.querySelectorAll("button, [role='button'], h4, h3, span, div, label");
        for (var i = 0; i < nodes.length; i++) {
          var t = (nodes[i].textContent || "").replace(/\s+/g, " ").trim();
          if (!t || t.length > 80) continue;
          var hit = (id && title && t.indexOf(String(id)) !== -1 && t.indexOf(title) !== -1);
          if (!hit) continue;
          var btn = nodes[i].closest("button") || nodes[i];
          try { btn.click(); } catch (e) {}
          var row = nodes[i].closest("[class*='ListControl']") ||
                    nodes[i].closest("[class*='NestedObject']") ||
                    nodes[i].closest("li") ||
                    nodes[i].parentElement;
          if (row) {
            row.classList.add("cms-open-piece");
            row.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          return;
        }
      }
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "cms-open-piece") openPiece(d.id, d.title);
      });
    })();
  </script>
</body>
</html>
