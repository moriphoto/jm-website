<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit — John Mackenzie Ceramics</title>
  <style>
    #cms-back {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 100000;
      color: #fff;
      border: 1px solid rgba(255,255,255,.45);
      background: #0a0a0a;
      text-decoration: none;
      font: 700 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 9px 14px;
    }
    #cms-back:hover { color: #c4a35a; border-color: #c4a35a; }
    #cms-netlify {
      position: fixed;
      top: 48px;
      right: 12px;
      z-index: 100000;
      color: #fff;
      border: 1px solid rgba(255,255,255,.45);
      background: #0a0a0a;
      font: 700 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
    }
    #cms-netlify.on { color: #ffb4b4; border-color: #ff5a5a; }
    #cms-netlify:hover { color: #c4a35a; border-color: #c4a35a; }
    img {
      max-height: 360px !important;
      max-width: 100% !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      background: #111;
    }
    .cms-open-piece {
      outline: 1px solid #c4a35a !important;
      background: rgba(196,163,90,.12) !important;
    }
  </style>
</head>
<body>
  <a id="cms-back" href="../">Back</a>
  <button id="cms-netlify" type="button">Netlify off</button>
  <script>
    localStorage.setItem("netlifySiteURL", "https://jmceramics.netlify.app");
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" data-netlify-identity="https://jmceramics.netlify.app/.netlify/identity"></script>
  <script>
    (function () {
      var API = "https://jmceramics.netlify.app/.netlify/identity";
      if (!window.netlifyIdentity) return;
      var raw = netlifyIdentity.init.bind(netlifyIdentity);
      netlifyIdentity.init = function (opts) {
        opts = opts || {};
        opts.APIUrl = API;
        return raw(opts);
      };
      netlifyIdentity.init({ APIUrl: API });
    })();
  </script>
  <script>
    (function () {
      var GIT = "https://jmceramics.netlify.app/.netlify/git/github";
      var FLAG = "netlify-deploy.txt";
      var btn = document.getElementById("cms-netlify");
      if (!btn) return;
      function token() {
        try {
          var u = window.netlifyIdentity && netlifyIdentity.currentUser();
          return (u && u.token && u.token.access_token) || "";
        } catch (e) { return ""; }
      }
      function paint(mode) {
        btn.dataset.mode = mode;
        btn.classList.toggle("on", mode === "on");
        btn.textContent = mode === "on" ? "Stop Netlify" : "Netlify off";
        btn.title = mode === "on"
          ? "Netlify builds every publish. Tap to stop that."
          : "Netlify is not building. Tap to allow it again.";
      }
      function readFlag() {
        return fetch("https://raw.githubusercontent.com/moriphoto/jm-website/main/" + FLAG + "?t=" + Date.now())
          .then(function (r) { return r.ok ? r.text() : "off"; })
          .then(function (t) { return t.trim() === "on" ? "on" : "off"; })
          .catch(function () { return "off"; });
      }
      function writeFlag(mode) {
        var t = token();
        if (!t) {
          btn.textContent = "Sign in first";
          return Promise.resolve();
        }
        btn.disabled = true;
        btn.textContent = "Saving…";
        return fetch(GIT + "/contents/" + FLAG + "?ref=main", {
          headers: { Authorization: "Bearer " + t }
        }).then(function (r) { return r.json(); }).then(function (cur) {
          var body = {
            message: mode === "off" ? "Stop Netlify auto-deploy." : "Allow Netlify auto-deploy.",
            content: btoa(mode + "\n"),
            branch: "main"
          };
          if (cur && cur.sha) body.sha = cur.sha;
          return fetch(GIT + "/contents/" + FLAG, {
            method: "PUT",
            headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
        }).then(function (r) {
          if (!r.ok) throw new Error("save");
          paint(mode);
        }).catch(function () {
          btn.textContent = "Not saved";
        }).then(function () { btn.disabled = false; });
      }
      readFlag().then(paint);
      btn.onclick = function () {
        writeFlag(btn.dataset.mode === "on" ? "off" : "on");
      };
    })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="preview-works.js"></script>
  <script>
    (function () {
      var onPages = location.hostname.indexOf("github.io") !== -1;
      var publicFolder = onPages ? "/jm-website/images" : "/images";
      var siteUrl = onPages ? (location.origin + "/jm-website") : "https://jmceramics.netlify.app";
      CMS.init({
        config: {
          load_config_file: true,
          public_folder: publicFolder,
          site_url: siteUrl,
          display_url: siteUrl
        }
      });

      var ROOT = "https://moriphoto.github.io/jm-website/";
      var DRAFT = "https://raw.githubusercontent.com/moriphoto/jm-website/cms/catalogue/works/jm-website/";
      function fixImg(img) {
        if (!img) return;
        var s = img.getAttribute("src") || img.currentSrc || "";
        if (!s || s.indexOf("blob:") === 0 || s.indexOf("raw.githubusercontent.com") !== -1) return;
        var i = s.indexOf("images/");
        var rel = "";
        if (i !== -1) rel = s.slice(i);
        else if (s.indexOf("studio/") !== -1) rel = "images/" + s.slice(s.indexOf("studio/"));
        if (!rel) return;
        var next = ROOT + rel;
        if (img.getAttribute("src") !== next) img.setAttribute("src", next);
        if (img.dataset.draft) return;
        img.dataset.draft = "1";
        img.addEventListener("error", function () {
          var name = rel.split("/").pop();
          if (name) img.src = DRAFT + "images/" + name;
        });
      }
      function fixAll() {
        document.querySelectorAll("img").forEach(fixImg);
      }
      new MutationObserver(fixAll).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["src"] });
      setInterval(fixAll, 800);

      function pingPreview(id, title) {
        try { localStorage.setItem("cmsFocusId", id || ""); } catch (err) {}
        document.querySelectorAll("iframe").forEach(function (f) {
          try {
            f.contentWindow.postMessage({ type: "cms-open-piece", id: id, title: title }, "*");
          } catch (err) {}
        });
      }
      document.addEventListener("click", function (e) {
        var n = e.target;
        for (var k = 0; n && k < 6; n = n.parentElement, k++) {
          var s = (n.textContent || "").replace(/\s+/g, " ").trim();
          var m = s.match(/^(\d{1,3})\s{1,3}(.{2,40})$/);
          if (!m) continue;
          if (m[0].length > 60) continue;
          pingPreview(m[1], m[2]);
          var row = n.closest("[class*='NestedObject']") || n.closest("[class*='ListControl']") || n.closest("li") || n;
          document.querySelectorAll(".cms-open-piece").forEach(function (x) { x.classList.remove("cms-open-piece"); });
          row.classList.add("cms-open-piece");
          return;
        }
      }, true);

      function openPiece(id, title) {
        pingPreview(id, title);
        document.querySelectorAll(".cms-open-piece").forEach(function (n) { n.classList.remove("cms-open-piece"); });
        var nodes = document.querySelectorAll("button, [role='button'], h4, h3, span, div, label");
        for (var i = 0; i < nodes.length; i++) {
          var t = (nodes[i].textContent || "").replace(/\s+/g, " ").trim();
          if (!t || t.length > 80) continue;
          var hit = (id && title && t.indexOf(String(id)) !== -1 && t.indexOf(title) !== -1);
          if (!hit) continue;
          var btn = nodes[i].closest("button") || nodes[i];
          try { btn.click(); } catch (e) {}
          var row = nodes[i].closest("[class*='ListControl']") ||
                    nodes[i].closest("[class*='NestedObject']") ||
                    nodes[i].closest("li") ||
                    nodes[i].parentElement;
          if (row) {
            row.classList.add("cms-open-piece");
            row.scrollIntoView({ block: "center", behavior: "smooth" });
          }
          return;
        }
      }
      window.addEventListener("message", function (e) {
        var d = e.data || {};
        if (d.type === "cms-open-piece") openPiece(d.id, d.title);
        if (d.type === "cms-bring-back") bringBack(d.id, d.title);
      });

      function uncheckArchiveNear(row) {
        var scope = row || document;
        var nodes = scope.querySelectorAll("label, span, div, p");
        for (var i = 0; i < nodes.length; i++) {
          var t = (nodes[i].textContent || "").replace(/\s+/g, " ").trim();
          if (t.indexOf("Archive") === -1) continue;
          if (t.length > 90) continue;
          var root = nodes[i].closest("[class*='Control']") || nodes[i].parentElement || nodes[i];
          var box = root.querySelector("input[type=checkbox]");
          if (box) {
            if (box.checked) box.click();
            return true;
          }
          var sw = root.querySelector("[role='switch'], [class*='Toggle'] button, [class*='Toggle']");
          if (sw) {
            var on = sw.getAttribute("aria-checked") === "true" || sw.className.indexOf("active") !== -1;
            if (on) sw.click();
            else sw.click();
            return true;
          }
        }
        return false;
      }

      function bringBack(id, title) {
        openPiece(id, title);
        var tries = 0;
        var tick = setInterval(function () {
          tries += 1;
          if (uncheckArchiveNear(document.querySelector(".cms-open-piece")) || tries > 12) {
            clearInterval(tick);
          }
        }, 250);
      }
    })();
  </script>
</body>
</html>
