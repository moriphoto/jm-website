backend:
  name: git-gateway
  branch: main

media_folder: jm-website/images
public_folder: /images

site_url: https://jmceramics.netlify.app
display_url: https://jmceramics.netlify.app
logo_url: /images/mark-jm.png

locale: en-gb

collections:
  - name: catalogue
    label: Catalogue
    files:
      - name: works
        label: Pieces and collection
        file: jm-website/data/works.json
        fields:
          - { name: collection_name, label: Collection name, widget: string }
          - name: pieces
            label: Pieces
            widget: list
            summary: "{{title}} — {{id}}"
            fields:
              - { name: id, label: ID, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: note, label: Description, widget: text }
              - { name: price, label: Price, widget: string, required: false, default: "On request" }
              - { name: src, label: Image, widget: image }
              - { name: archived, label: Archive (hide from public site), widget: boolean, default: false, required: false }

  - name: assets
    label: Assets
    files:
      - name: site_assets
        label: Splash, collection, About pictures
        file: jm-website/data/assets.json
        fields:
          - { name: splash_video, label: Splash film (mp4), widget: file }
          - { name: splash_poster, label: Splash still, widget: image }
          - { name: collection, label: Opening group shot, widget: image }
          - { name: about_john, label: About — John at the kiln, widget: image }
          - { name: about_ports, label: About — side ports, widget: image }
          - { name: about_firebox, label: About — firebox, widget: image }
          - { name: about_shed, label: About — night firing, widget: image }

  - name: pages
    label: Pages
    files:
      - name: copy
        label: About, Enquire, Courses
        file: jm-website/data/pages.json
        fields:
          - { name: about_lead, label: About — opening line, widget: text }
          - { name: about_p1, label: About — paragraph 1, widget: text }
          - { name: about_p2, label: About — paragraph 2, widget: text }
          - { name: kiln_p1, label: Gweek kiln — paragraph 1, widget: text }
          - { name: kiln_quote, label: Gweek kiln — quote, widget: text }
          - { name: kiln_p2, label: Gweek kiln — paragraph 2, widget: text }
          - { name: enquire_intro, label: Enquire — introduction, widget: text }
          - { name: courses_lead, label: Courses — opening line, widget: text }
          - { name: courses_p1, label: Courses — paragraph 1, widget: text }
          - { name: courses_p2, label: Courses — paragraph 2, widget: text }
          - { name: courses_dates, label: Courses — dates (one per line), widget: text }
      - name: help
        label: How to use this admin
        file: jm-website/data/admin-help.md
        fields:
          - { name: body, label: Tutorial, widget: markdown }
