<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media — Studio stills</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root { --gold:#c4a35a; --rust:#8a4a22; --mute:#8a8a8a; }
    * { box-sizing:border-box; }
    body { margin:0; background:#0a0a0a; color:#f3f3f3; font-family:Helvetica,Arial,sans-serif; }
    header { padding:20px; border-bottom:1px solid #222; }
    header p.k { letter-spacing:.2em; text-transform:uppercase; font-size:10px; color:var(--rust); margin:0; }
    h1 { font-size:22px; margin:8px 0 0; }
    .lead { color:var(--mute); font-size:14px; max-width:50ch; line-height:1.45; }
    a { color:var(--gold); }
    .bar { padding:16px 20px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button, .btn, label.btn {
      font:700 11px/1 Helvetica,Arial,sans-serif; letter-spacing:.16em; text-transform:uppercase;
      background:none; color:#fff; border:1px solid #fff; padding:12px 16px; cursor:pointer; text-decoration:none;
    }
    label.btn { background:#fff; color:#000; }
    #files, #return { position:absolute; width:0; height:0; opacity:0; }
    #status { color:var(--gold); font-size:13px; }
    ul { list-style:none; margin:0; padding:0 20px 40px; }
    li { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid #222; font-size:13px; }
    li label { flex:1; display:flex; gap:8px; align-items:center; color:#ccc; word-break:break-all; }
    li button.kill { padding:8px 10px; color:#ff5a5a; border-color:#ff5a5a; }
  </style>
</head>
<body>
  <header>
    <p class="k">John Mackenzie Ceramics — media</p>
    <h1>Inbox</h1>
    <p class="lead">Upload raw frames. Tick what to retouch. Send to Stills. Bring the 1920s back here, then delete the unused raws.</p>
  </header>
  <div class="bar">
    <label class="btn" for="files">Upload</label>
    <input id="files" type="file" accept="image/*" multiple>
    <button type="button" id="send">Send to Stills</button>
    <label class="btn" for="return">Return retouched</label>
    <input id="return" type="file" accept="image/jpeg,.jpg,.jpeg" multiple>
    <a class="btn" href="/admin/">Editor</a>
    <span id="status"></span>
  </div>
  <ul id="list"></ul>
  <script>
    const API = "/.netlify/git/github";
    const FOLDER = "jm-website/images/inbox";
    const STILLS = "https://moriphoto.github.io/studio-stills/";
    const PUBLIC = location.origin + "/images/inbox/";
    const status = document.getElementById("status");
    const listEl = document.getElementById("list");
    let rows = [];

    function say(t) { status.textContent = t || ""; }

    async function token() {
      const u = netlifyIdentity.currentUser();
      if (!u) { netlifyIdentity.open(); throw new Error("Sign in first"); }
      if (u.jwt) await u.jwt();
      return u.token.access_token;
    }

    function toB64(file) {
      return new Promise(function (res, rej) {
        const r = new FileReader();
        r.onload = function () { res(String(r.result || "").replace(/^data:[^;]+;base64,/, "")); };
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    function safeName(name) {
      return String(name || "still.jpg").replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+/, "") || "still.jpg";
    }

    function draw() {
      listEl.innerHTML = "";
      if (!rows.length) { listEl.innerHTML = "<li><span>Inbox empty.</span></li>"; return; }
      rows.forEach(function (f) {
        const li = document.createElement("li");
        const lab = document.createElement("label");
        lab.innerHTML = "<input type=\"checkbox\" data-name=\"" + f.name + "\"> " + f.name;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "kill";
        del.textContent = "Delete";
        del.onclick = function () { removeFile(f); };
        li.appendChild(lab);
        li.appendChild(del);
        listEl.appendChild(li);
      });
      say(rows.length + " in inbox");
    }

    async function listInbox() {
      say("Loading media…");
      const t = await token();
      const r = await fetch(API + "/contents/" + FOLDER + "?ref=main", { headers: { Authorization: "Bearer " + t } });
      if (r.status === 404) { rows = []; draw(); say(""); return; }
      if (!r.ok) { say("Could not read media. Sign in."); return; }
      const data = await r.json();
      rows = (Array.isArray(data) ? data : []).filter(function (f) {
        return f.type === "file" && /\.(jpe?g|png|webp)$/i.test(f.name);
      });
      draw();
    }

    async function putFile(name, file) {
      const t = await token();
      const content = await toB64(file);
      const existing = rows.find(function (f) { return f.name === name; });
      const body = { message: "inbox " + name, content: content, branch: "main" };
      if (existing && existing.sha) body.sha = existing.sha;
      const put = await fetch(API + "/contents/" + FOLDER + "/" + name, {
        method: "PUT",
        headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!put.ok) throw new Error((await put.text()).slice(0, 80) || String(put.status));
    }

    async function uploadFiles(fileList, retouch) {
      const files = Array.from(fileList || []).filter(function (f) {
        return /^image\//.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name);
      });
      if (!files.length) { say("Pick JPEGs."); return; }
      for (let i = 0; i < files.length; i++) {
        let name = safeName(files[i].name);
        if (retouch && !/-1920/i.test(name)) name = name.replace(/\.(jpe?g|png|webp)$/i, "-1920.jpg");
        say("Saving " + name + "…");
        try { await putFile(name, files[i]); }
        catch (err) { say("Upload failed: " + err.message); return; }
      }
      say(retouch ? "Retouched stills back in media." : "Saved to media. Wait for publish before Send.");
      listInbox();
    }

    async function removeFile(f) {
      if (!confirm("Delete " + f.name + " from media?")) return;
      const t = await token();
      const del = await fetch(API + "/contents/" + FOLDER + "/" + f.name, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "remove inbox " + f.name, sha: f.sha, branch: "main" })
      });
      if (!del.ok) { say("Delete failed."); return; }
      say("Deleted " + f.name);
      listInbox();
    }

    document.getElementById("files").onchange = function (e) {
      uploadFiles(e.target.files, false);
      e.target.value = "";
    };
    document.getElementById("return").onchange = function (e) {
      uploadFiles(e.target.files, true);
      e.target.value = "";
    };
    document.getElementById("send").onclick = function () {
      const names = Array.from(listEl.querySelectorAll("input:checked")).map(function (b) { return b.getAttribute("data-name"); });
      if (!names.length) { say("Tick the frames to retouch."); return; }
      const urls = names.map(function (n) { return PUBLIC + encodeURIComponent(n); }).slice(0, 20);
      location.href = STILLS + "?images=" + encodeURIComponent(urls.join(",")) + "&return=" + encodeURIComponent(location.origin + "/admin/stills.html");
    };
    netlifyIdentity.on("init", function (user) {
      if (user) listInbox();
      else say("Sign in to use media.");
    });
    netlifyIdentity.on("login", function () { listInbox(); });
    netlifyIdentity.init();
  </script>
</body>
</html>
