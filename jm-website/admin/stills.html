<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media — Studio stills</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root { --gold:#c4a35a; --rust:#8a4a22; --mute:#8a8a8a; }
    * { box-sizing:border-box; }
    body { margin:0; background:#0a0a0a; color:#f3f3f3; font-family:Helvetica,Arial,sans-serif; }
    header { padding:20px; border-bottom:1px solid #222; }
    header p.k { letter-spacing:.2em; text-transform:uppercase; font-size:10px; color:var(--rust); margin:0; }
    h1 { font-size:22px; margin:8px 0 0; }
    .lead { color:var(--mute); font-size:14px; max-width:46ch; line-height:1.45; }
    a { color:var(--gold); }
    .bar { padding:16px 20px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button, .btn, label.btn {
      font:700 11px/1 Helvetica,Arial,sans-serif; letter-spacing:.16em; text-transform:uppercase;
      background:none; color:#fff; border:1px solid #fff; padding:12px 16px; cursor:pointer; text-decoration:none;
    }
    label.btn { background:#fff; color:#000; }
    #files { position:absolute; width:0; height:0; opacity:0; }
    #status { color:var(--gold); font-size:13px; }
    ul { list-style:none; margin:0; padding:0 20px 40px; }
    li { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #222; font-size:13px; }
    li span { flex:1; word-break:break-all; color:#ccc; }
    li button { padding:8px 10px; color:#ff5a5a; border-color:#ff5a5a; }
  </style>
</head>
<body>
  <header>
    <p class="k">John Mackenzie Ceramics — media</p>
    <h1>Inbox</h1>
    <p class="lead">Upload from the phone. Files land in media/inbox. Delete anything you are not using. Process the still in the Stills app.</p>
  </header>
  <div class="bar">
    <label class="btn" for="files">Upload</label>
    <input id="files" type="file" accept="image/*" multiple>
    <a class="btn" href="https://moriphoto.github.io/studio-stills/">Open Stills</a>
    <a class="btn" href="/admin/">Editor</a>
    <span id="status"></span>
  </div>
  <ul id="list"></ul>
  <script>
    const API = "/.netlify/git/github";
    const FOLDER = "jm-website/images/inbox";
    const status = document.getElementById("status");
    const listEl = document.getElementById("list");

    function say(t) { status.textContent = t || ""; }

    async function token() {
      const u = netlifyIdentity.currentUser();
      if (!u) {
        netlifyIdentity.open();
        throw new Error("Sign in first");
      }
      if (u.jwt) await u.jwt();
      return u.token.access_token;
    }

    function toB64(file) {
      return new Promise(function (res, rej) {
        const r = new FileReader();
        r.onload = function () {
          const s = String(r.result || "");
          res(s.replace(/^data:[^;]+;base64,/, ""));
        };
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    function safeName(name) {
      return String(name || "still.jpg").replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+/, "") || "still.jpg";
    }

    async function listInbox() {
      say("Loading media…");
      const t = await token();
      const r = await fetch(API + "/contents/" + FOLDER + "?ref=main", {
        headers: { Authorization: "Bearer " + t }
      });
      if (r.status === 404) { listEl.innerHTML = "<li><span>Inbox empty.</span></li>"; say(""); return; }
      if (!r.ok) { say("Could not read media. Sign in."); return; }
      const rows = await r.json();
      const files = (Array.isArray(rows) ? rows : []).filter(function (f) {
        return f.type === "file" && /\.(jpe?g|png|webp)$/i.test(f.name);
      });
      listEl.innerHTML = "";
      if (!files.length) listEl.innerHTML = "<li><span>Inbox empty.</span></li>";
      files.forEach(function (f) {
        const li = document.createElement("li");
        li.innerHTML = "<span>" + f.name + "</span>";
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "Delete";
        del.onclick = function () { removeFile(f); };
        li.appendChild(del);
        listEl.appendChild(li);
      });
      say(files.length ? files.length + " in inbox" : "");
    }

    async function uploadFiles(fileList) {
      const files = Array.from(fileList || []).filter(function (f) { return /^image\//.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name); });
      if (!files.length) { say("Pick JPEGs."); return; }
      const t = await token();
      for (let i = 0; i < files.length; i++) {
        const name = safeName(files[i].name);
        say("Saving " + name + "…");
        const content = await toB64(files[i]);
        const put = await fetch(API + "/contents/" + FOLDER + "/" + name, {
          method: "PUT",
          headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
          body: JSON.stringify({ message: "inbox " + name, content: content, branch: "main" })
        });
        if (!put.ok) {
          const err = await put.text();
          say("Upload failed: " + (err.slice(0, 80) || put.status));
          return;
        }
      }
      say("Saved to media. Netlify will publish in a minute.");
      listInbox();
    }

    async function removeFile(f) {
      if (!confirm("Delete " + f.name + " from media?")) return;
      const t = await token();
      const del = await fetch(API + "/contents/" + FOLDER + "/" + f.name, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "remove inbox " + f.name, sha: f.sha, branch: "main" })
      });
      if (!del.ok) { say("Delete failed."); return; }
      say("Deleted " + f.name);
      listInbox();
    }

    document.getElementById("files").onchange = function (e) {
      uploadFiles(e.target.files);
      e.target.value = "";
    };
    netlifyIdentity.on("init", function (user) {
      if (user) listInbox();
      else say("Sign in to upload.");
    });
    netlifyIdentity.on("login", function () { listInbox(); });
    netlifyIdentity.init();
  </script>
</body>
</html>
